        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Product'
    ProductCollectionResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            meta:
              $ref: '#/components/schemas/PaginatedMeta'
    ProductImage:
