openapi: 3.0.1
info:
  title: Shop API
  version: v1
  description: |
    RESTful e-commerce API cung cấp bởi Shop API. Tất cả response trả về theo dạng chuẩn:

    ```json
    {
      "success": true,
      "data": {},
      "message": "Successfully"
    }
    ```
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: Production
security:
  - bearerAuth: []
paths:
  /api/v1/auth/sign_up:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignUpRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sign_in:
    post:
      tags: [Auth]
      summary: Đăng nhập và lấy JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignInRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Sai thông tin đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/sign_out:
    delete:
      tags: [Auth]
      summary: Đăng xuất khỏi hệ thống
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Refresh token thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/forgot_password:
    post:
      tags: [Auth]
      summary: Gửi email quên mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Email reset được gửi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/auth/reset_password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Reset mật khẩu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/users:
    get:
      tags: [Users]
      summary: Danh sách người dùng (admin)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Danh sách user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollectionResponse'
    post:
      tags: [Users]
      summary: Tạo người dùng (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Tạo user thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Xem chi tiết người dùng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Chi tiết user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    put:
      tags: [Users]
      summary: Cập nhật người dùng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      tags: [Users]
      summary: Xóa người dùng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/addresses:
    get:
      tags: [Addresses]
      summary: Danh sách địa chỉ của người dùng
      responses:
        '200':
          description: Danh sách địa chỉ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressCollectionResponse'
    post:
      tags: [Addresses]
      summary: Tạo địa chỉ mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Tạo địa chỉ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
  /api/v1/addresses/{id}:
    get:
      tags: [Addresses]
      summary: Xem chi tiết địa chỉ
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Chi tiết địa chỉ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
    put:
      tags: [Addresses]
      summary: Cập nhật địa chỉ
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Cập nhật địa chỉ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
    patch:
      tags: [Addresses]
      summary: Cập nhật địa chỉ (partial)
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Cập nhật địa chỉ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
    delete:
      tags: [Addresses]
      summary: Xóa địa chỉ
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa địa chỉ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/addresses/{id}/set_default:
    patch:
      tags: [Addresses]
      summary: Đặt địa chỉ mặc định
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Cập nhật địa chỉ mặc định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: Danh sách danh mục
      responses:
        '200':
          description: Danh sách danh mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCollectionResponse'
    post:
      tags: [Categories]
      summary: Tạo danh mục
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Tạo danh mục thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
  /api/v1/categories/{id}:
    get:
      tags: [Categories]
      summary: Chi tiết danh mục
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Danh mục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
    put:
      tags: [Categories]
      summary: Cập nhật danh mục
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
    delete:
      tags: [Categories]
      summary: Xóa danh mục
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/categories/{category_id}/products:
    get:
      tags: [Products]
      summary: Danh sách sản phẩm theo danh mục
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionResponse'
  /api/v1/products:
    get:
      tags: [Products]
      summary: Danh sách sản phẩm
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: q
          in: query
          schema:
            type: string
          description: Từ khóa tìm kiếm
        - name: sort
          in: query
          schema:
            type: string
          description: Sắp xếp (price asc, price desc, newest)
      responses:
        '200':
          description: Danh sách sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionResponse'
    post:
      tags: [Products]
      summary: Tạo sản phẩm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Tạo sản phẩm thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/products/{id}:
    get:
      tags: [Products]
      summary: Chi tiết sản phẩm
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Chi tiết sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    put:
      tags: [Products]
      summary: Cập nhật sản phẩm
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    delete:
      tags: [Products]
      summary: Xóa sản phẩm
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/products/{product_id}/variants:
    get:
      tags: [Variants]
      summary: Danh sách biến thể của sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách biến thể
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantCollectionResponse'
    post:
      tags: [Variants]
      summary: Tạo biến thể
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRequest'
      responses:
        '201':
          description: Tạo biến thể thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
  /api/v1/products/{product_id}/variants/{id}:
    put:
      tags: [Variants]
      summary: Cập nhật biến thể
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
    delete:
      tags: [Variants]
      summary: Xóa biến thể
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/products/{product_id}/product_images:
    get:
      tags: [Product Images]
      summary: Danh sách hình ảnh của sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách hình ảnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImageCollectionResponse'
    post:
      tags: [Product Images]
      summary: Thêm hình ảnh cho sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
      responses:
        '201':
          description: Tạo hình ảnh thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImageResponse'
  /api/v1/products/{product_id}/product_images/{id}:
    delete:
      tags: [Product Images]
      summary: Xóa hình ảnh của sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/products/{product_id}/reviews:
    get:
      tags: [Reviews]
      summary: Danh sách đánh giá theo sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCollectionResponse'
    post:
      tags: [Reviews]
      summary: Tạo đánh giá cho sản phẩm
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Tạo đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
  /api/v1/reviews:
    get:
      tags: [Reviews]
      summary: Danh sách đánh giá
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCollectionResponse'
  /api/v1/reviews/{id}:
    get:
      tags: [Reviews]
      summary: Chi tiết đánh giá
