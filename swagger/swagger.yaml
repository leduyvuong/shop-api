        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Chi tiết đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
    put:
      tags: [Reviews]
      summary: Cập nhật đánh giá
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
    delete:
      tags: [Reviews]
      summary: Xóa đánh giá
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Lấy danh sách sản phẩm trong giỏ hàng
      responses:
        '200':
          description: Danh sách giỏ hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartCollectionResponse'
    post:
      tags: [Cart]
      summary: Thêm sản phẩm vào giỏ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '201':
          description: Thêm giỏ hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
  /api/v1/cart/{id}:
    put:
      tags: [Cart]
      summary: Cập nhật số lượng sản phẩm trong giỏ
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemResponse'
    delete:
      tags: [Cart]
      summary: Xóa sản phẩm khỏi giỏ
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: Danh sách đơn hàng của người dùng
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Danh sách đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollectionResponse'
    post:
      tags: [Orders]
      summary: Tạo đơn hàng mới (Checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Tạo đơn hàng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Chi tiết đơn hàng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Chi tiết đơn hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    put:
      tags: [Orders]
      summary: Cập nhật đơn hàng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
    delete:
      tags: [Orders]
      summary: Hủy đơn hàng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Hủy thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Hủy đơn hàng (business flow)
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Đơn hàng được hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/{id}/complete:
    post:
      tags: [Orders]
      summary: Hoàn tất đơn hàng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Đơn hàng hoàn tất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/{id}/ship:
    post:
      tags: [Orders]
      summary: Cập nhật trạng thái giao hàng
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Cập nhật trạng thái giao hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/v1/orders/{order_id}/payments:
    get:
      tags: [Payments]
      summary: Danh sách thanh toán theo đơn hàng
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách thanh toán
          content:
