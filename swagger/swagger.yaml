      properties:
        id:
          type: integer
        image_url:
          type: string
    ProductImageRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
      required: [image]
    ProductImageResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
